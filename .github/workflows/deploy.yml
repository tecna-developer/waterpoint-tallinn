name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Проверки отдельным шагом перед сборкой: пуш в main деплоит демо автоматически, и без
  # этого барьера логическая регрессия уезжает к пользователям молча. Сборка сама по себе
  # ловит только то, что не парсится, — синтаксис. Сломанную сортировку или статусы
  # поймают именно тесты.
  # Отдельным job'ом, а не шагами внутри build: когда падает, в списке проверок сразу
  # видно «checks», а не «build», — понятно, что дело в поведении, а не в сборке.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 — та же мажорная версия, на которой прогоняются проверки локально; jsdom
          # к тому же требует минимум 20.19, и «просто 20» зависело бы от того, какую
          # именно 20.x подставит раннер.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Линтер
        run: npm run lint
      - name: Юнит-тесты логики данных
        run: npm test
      - name: Тесты service worker'а
        run: npm run test:sw

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
