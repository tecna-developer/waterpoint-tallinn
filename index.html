<body>
  <!-- #view-root — единственное, что перезаписывает render(); шторки (#app > .overlay)
       остаются его соседями и переживают любой ререндер вью (см. main.js render()). -->
  <div id="app"><div id="view-root"></div></div>
  <script type="module" src="/src/main.js"></script>

  <!-- Аварийный выход из белого экрана. Живёт прямо в HTML, а не в бандле: срабатывает
       именно тогда, когда бандл не загрузился (сорванный запрос, файл ещё не разошёлся
       по CDN после деплоя, повреждённый кеш). Без него пользователь видит пустоту без
       единой подсказки и без способа что-либо сделать. -->
  <script>
    setTimeout(function () {
      var root = document.getElementById('view-root');
      if (root && root.children.length) return;      // приложение отрисовалось
      root.innerHTML =
        '<div style="padding:32px 24px;font:15px/1.5 system-ui,sans-serif;color:#1b263b;text-align:center">' +
        '<p style="margin:0 0 6px;font-weight:600">Приложение не загрузилось</p>' +
        '<p style="margin:0 0 18px;color:#5c6b7d">Ei laadinud · Failed to load</p>' +
        '<button id="wpt-recover" style="font:inherit;padding:10px 18px;border:0;border-radius:12px;' +
        'background:#1a76a8;color:#fff;font-weight:600">Перезагрузить</button></div>';
      document.getElementById('wpt-recover').onclick = function () {
        // чистим кеши и воркер: самая частая причина — оболочка, собранная из
        // несовместимых версий файлов, и обычная перезагрузка её не исправит
        var done = function () { location.reload(true); };
        if (!window.caches) return done();
        caches.keys()
          .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
          .then(function () {
            return navigator.serviceWorker
              ? navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(rs.map(function (r) { return r.unregister(); }));
                })
              : null;
          })
          .then(done, done);
      };
    }, 8000);
  </script>
</body>
